<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harbor</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Harbor</a>
      <p id="status" class="session">Loading your session…</p>

          <button id="sign-in" class="btn" type="button">Sign in</button>

        <div id="signed-in" hidden>
          <div id="user-button"></div>
        </div>
      </nav>
    </header>
    <div id="app" class="app-shell gate-shell"></div>
